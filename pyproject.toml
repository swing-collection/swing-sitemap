# -*- coding: utf-8 -*-


# =============================================================================
# Project Configuration
# =============================================================================

[tool.poetry]
name = "my_django_plugin"
version = "0.1.0"
description = "A Django plugin for..."
authors = ["Your Name <your.email@example.com>"]
license = "MIT"


# =============================================================================
# Dependencies
# =============================================================================

[tool.poetry.dependencies]
python = "^3.8"
Django = "^4.0"


# =============================================================================
# Development Dependencies
# =============================================================================

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"           # Framework for testing
pytest-cov = "^6.1.1"       # Code coverage for tests
black = "^24.8.0"           # Code formatter
flake8 = "^7.2.0"           # Linter for code quality
mypy = "^1.15.0"            # Static type checker
sphinx = "^8.0.2"           # Documentation generator
isort = "^5.10.1"           # Import sorter
tox = "^4.4.6"              # Testing multiple environments
pre-commit = "^4.0.1"       # Pre-commit hooks for linting and formatting


# =============================================================================
# Build System
# =============================================================================

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
my_django_plugin = 'my_django_plugin:main'
