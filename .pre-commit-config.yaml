# =============================================================================
# Pre-commit Configuration
# =============================================================================
#
# Git hook scripts to run on every commit.
# Documentation: https://pre-commit.com/
#
# Install:
#   pre-commit install
#
# Run on all files:
#   pre-commit run --all-files
#
# This file is portable across swing-* repos.
#
# =============================================================================

default_stages: [pre-commit]

default_language_version:
  python: python3.12

repos:
  # ---------------------------------------------------------------------------
  # General Quality Checks
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-symlinks
      - id: detect-private-key
      - id: end-of-file-fixer
        exclude: ^(VERSION|.*\.min\..*|.*/static/.*)$
      - id: trailing-whitespace
        exclude: ^(.*\.min\..*|.*/static/.*)$
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ---------------------------------------------------------------------------
  # Data File Validation
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-json
        exclude: ^(\.vscode/|tsconfig.*\.json$)
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml

  # ---------------------------------------------------------------------------
  # Python - Code Formatting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/asottile/add-trailing-comma
    rev: v3.1.0
    hooks:
      - id: add-trailing-comma

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.12

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ["--profile", "black"]

  # ---------------------------------------------------------------------------
  # Python - Linting
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pycqa/flake8
    rev: 7.1.1
    hooks:
      - id: flake8
        additional_dependencies:
          - flake8-bugbear
          - flake8-comprehensions

  - repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
      - id: python-check-blanket-noqa
      - id: python-check-blanket-type-ignore
      - id: python-no-eval
      - id: python-use-type-annotations

  # ---------------------------------------------------------------------------
  # HTML / Jinja Templates
  # ---------------------------------------------------------------------------
  - repo: https://github.com/djlint/djLint
    rev: v1.36.4
    hooks:
      - id: djlint-reformat-django
        files: \.(html|jinja|jinja2)$
        exclude: (node_modules|\.venv|htmlcov|site|dist|build)/
      - id: djlint-django
        files: \.(html|jinja|jinja2)$
        exclude: (node_modules|\.venv|htmlcov|site|dist|build)/

  # ---------------------------------------------------------------------------
  # Security
  # ---------------------------------------------------------------------------
  - repo: https://github.com/PyCQA/bandit
    rev: 1.8.3
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml", "-r"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tst/|tests/)
